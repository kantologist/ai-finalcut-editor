[project]
name = "ai-finalcut-editor"
version = "0.2.0"
description = "Open-source AI assistant editor for Final Cut Pro — local desktop + CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AI Final Cut Editor contributors" }
]
keywords = ["final-cut-pro", "fcpxml", "ai", "video-editing", "openai", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "openai>=3.0.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.4",
]
dev = [
    "pyinstaller>=6.11",
    "pywebview>=5.4",
]

[project.urls]
Homepage = "https://kantologist.github.io/ai-finalcut-editor/"
Repository = "https://github.com/kantologist/ai-finalcut-editor"
Issues = "https://github.com/kantologist/ai-finalcut-editor/issues"
Download = "https://github.com/kantologist/ai-finalcut-editor/releases/latest/download/AI-Final-Cut-Editor.dmg"

[project.scripts]
ai-edit = "src.cli:main"
ai-edit-desktop = "src.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/webapp/static" = "src/webapp/static"
"src/webapp/templates" = "src/webapp/templates"
"prompts" = "prompts"
"packaging/bundle_workspace/settings.json" = "workspace/settings.json"
